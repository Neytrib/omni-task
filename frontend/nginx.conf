upstream task_api {
    zone task_api 64k;
    # Docker can assign a new address when provider settings recreate the API.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Credentials never appear in access records, including malicious query strings.
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Only the three pinned dnd-kit styles may be injected; arbitrary inline styles remain blocked.
    # security.test.ts checks these hashes against the installed library on upgrades.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-P3zrZWkaCzrI/B9T0+WLFRTTY8rvTIfnbvP5TBI9Vgo=' 'sha256-E7zJXfkufcgTIQG1Th6iYnoGis+rTfZd044bgiM1kr4=' 'sha256-YYLJe/bgx7gKdFc8dp3EM3/S8hpKeZs7JyhfBoZYPuk='; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /health { return 200 'ready'; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api/ws/tasks {
        proxy_pass http://task_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
    location ^~ /api/ {
        proxy_pass http://task_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
